name: citera

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: citera
      POSTGRES_PASSWORD: citera
      POSTGRES_DB: citera
    ports:
      # Host port is configurable because 5432 is commonly already taken by a local Postgres.
      # If you change it, change the port in DATABASE_URL too (env.example).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citera -d citera"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: citera
      MINIO_ROOT_PASSWORD: citera-dev-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console  -> http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Creates the bucket once, then exits. Safe to re-run.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 citera citera-dev-secret &&
      mc mb --ignore-existing local/citera &&
      mc anonymous set download local/citera &&
      echo 'bucket citera ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
